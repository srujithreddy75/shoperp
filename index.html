    }
    /* Keep animations focused on interactive elements instead of every DOM node. */
    button, a, input, select, textarea, .transition {
      transition: background-color 140ms cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 140ms cubic-bezier(0.22, 1, 0.36, 1),
                  transform 150ms cubic-bezier(0.22, 1, 0.36, 1),

    @media (prefers-reduced-motion: reduce) {

        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
    @keyframes silkFadeSlide {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes zariShimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes errorShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }

    }
    .silk-enter {

    .shake-error {

    }
    button:active {

    @media print {

        display: none !important;
      }

        display: block !important;
      }
      body {

    }

            'Content-Type': 'application/json',
            'X-Client-Id': CLIENT_ID
          },
          body: JSON.stringify({ data: db, clientId: CLIENT_ID })
        });
        if (res.ok) {
          serverConnected = true;
          lastServerSyncAt = new Date().toLocaleTimeString();
          updateServerBadgeUi();
        } else {
          serverConnected = false;
          updateServerBadgeUi();
        }
      } catch (err) {
        serverConnected = false;
        updateServerBadgeUi();
      } finally {
        isServerPushing = false;
      }
    }

    async function fetchServerState() {
      try {
        const res = await fetch(API_BASE + '/api/state');
        if (res.ok) {
          const json = await res.json();
          if (json && json.data) {
            isApplyingRemoteUpdate = true;
            db = json.data;
            serverConnected = true;
            lastServerSyncAt = new Date().toLocaleTimeString();
            if (window.localStorage) {
              try { window.localStorage.setItem(ERP_STORAGE_KEY, JSON.stringify(db)); } catch (e) {}
            }
            render();
            isApplyingRemoteUpdate = false;
            updateServerBadgeUi();
            return true;
          }
        }
      } catch (err) {
        console.warn('Backend server offline or unreachable:', err.message);
        serverConnected = false;
        updateServerBadgeUi();
      } finally {
        isApplyingRemoteUpdate = false;
      }
      return false;
    }

    function connectSSE() {
      if (typeof window === "undefined" || !window.EventSource) return;
      try {
        const es = new EventSource(API_BASE + '/api/events?clientId=' + CLIENT_ID);
        es.onmessage = function(e) {
          try {
            const payload = JSON.parse(e.data);
            if (payload.type === 'sync' && !isServerPushing) {
              fetchServerState();
            }
          } catch (err) {}
        };
        es.onopen = function() {
          serverConnected = true;
          updateServerBadgeUi();
        };
        es.onerror = function() {
          serverConnected = false;
          updateServerBadgeUi();
        };
      } catch (e) {}
    }

    async function uploadAssetToServer(dataUrl, category = 'asset') {
      try {
        const res = await fetch(API_BASE + '/api/upload', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Client-Id': CLIENT_ID
          },
          body: JSON.stringify({ dataUrl, category, clientId: CLIENT_ID })
        });
        if (res.ok) {
          const json = await res.json();
          if (json && json.url) return json.url;
        }
      } catch (e) {
        console.warn('Could not upload asset to server:', e);
      }
      return dataUrl; // fallback to original dataUrl
    }

      if (db.settings.freshStartInitialized) return;

      // Keep customer records and credentials, but clear demo business activity and balances.
      db.orders = [];
      db.materialPurchases = [];
      db.expenses = [];
      db.dailyAttendanceLogs = [];
      (db.suppliers || []).forEach(supplier => {
        supplier.totalPurchased = 0;
        supplier.totalPaid = 0;
      });
      (db.staffPayroll || []).forEach(staff => {
        staff.presentDays = 0;
        staff.baseSalary = 0;
        staff.dailyWage8Hr = 0;
        staff.otHoursWeek = 0;
        staff.otHourlyRate = 0;
        staff.pieceRateCount = 0;
        staff.pieceRateAmount = 0;
        staff.paidThisMonth = 0;

      });
      db.settings.freshStartInitialized = true;

    function initDatabase() {
      try {
        if (typeof window !== "undefined") {
          const savedPermanent =
            (window.localStorage && window.localStorage.getItem(ERP_STORAGE_KEY)) ||
            (window.localStorage && window.localStorage.getItem(LEGACY_STORAGE_KEY)) ||
            (window.sessionStorage && window.sessionStorage.getItem(ERP_STORAGE_KEY)) ||
            (window.sessionStorage && window.sessionStorage.getItem(LEGACY_STORAGE_KEY));

          if (savedPermanent) {
            const parsed = safeJsonParse(savedPermanent);
            if (parsed && parsed.settings && parsed.settings.credentials && Array.isArray(parsed.orders)) {
              db = parsed;
              if (!Array.isArray(db.dailyAttendanceLogs)) {
                db.dailyAttendanceLogs = createDefaultState().dailyAttendanceLogs;
              }
              // Normalize any old "Dress + Point" labels in saved orders to "Dress + Pant"
              db.orders.forEach(o => {
                if (o.outfitLabel) {
                  o.outfitLabel = o.outfitLabel.replace(/Point\s*\(Pant\)/gi, "Pant").replace(/Point/gi, "Pant");
                }
                if (o.garmentDesc) {
                  o.garmentDesc = o.garmentDesc.replace(/Point\s*\(Pant\)/gi, "Pant");
                }
                if (o.status === "Quality Check") {
                  o.status = "Stitching Completed";
                }
              });
              (db.staffPayroll || []).forEach(st => {
                st.standardDailyHours = STANDARD_DAILY_DUTY_HOURS;
              });
              applyFreshStartDefaults();
              saveState();
              return;
            }
          }
        }
      } catch (e) {}
      db = createDefaultState();
      applyFreshStartDefaults();
      saveState();
    }

    // Order Count Analytics Helper (Daily, Weekly, Monthly + Date-wise Breakdown)
    function getOrderVolumeStats() {
      const todayIso = new Date().toISOString().slice(0, 10);
      const todayStart = new Date(`${todayIso}T00:00:00`);
      const currentMonthPrefix = todayIso.slice(0, 7);
      let todayCount = 0;
      let weeklyCount = 0;
      let monthlyCount = 0;
      const dailyMap = Object.create(null);

      db.orders.forEach(order => {
        const date = order.bookingDate || todayIso;
        const day = dailyMap[date] || (dailyMap[date] = { count: 0, maggamCount: 0, stitchingCount: 0 });
        day.count++;
        if (order.serviceType === "Maggam Work + Blouse Stitching") day.maggamCount++;
        else day.stitchingCount++;

        if (date === todayIso) todayCount++;
        if (date.startsWith(currentMonthPrefix)) monthlyCount++;
        const orderDate = new Date(`${date}T00:00:00`);
        const diffDays = Math.floor((todayStart - orderDate) / 86400000);
        if (diffDays >= 0 && diffDays <= 6) weeklyCount++;
      });

      const sortedDates = Object.keys(dailyMap).sort((a, b) => b.localeCompare(a));
      const latestDayDate = sortedDates[0] || todayIso;
      return {
        todayIso,
        todayCount,
        latestDayDate,
        latestDayCount: dailyMap[latestDayDate]?.count || 0,
        weeklyCount,
        monthlyCount,
        totalOrders: db.orders.length,
        dailyBreakdown: sortedDates.map(date => ({ date, ...dailyMap[date] }))
      };
    }

    function getOrdersCompletedTodayCount() {
      const todayIso = new Date().toISOString().slice(0, 10);
      return db.orders.reduce((count, order) => count + (order.completedDate === todayIso ? 1 : 0), 0);
    }

    // Daily Attendance & Duty Start / End Helper Functions
    function getCurrentFormattedTime() {
      return new Date().toLocaleTimeString("en-IN", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      });
    }

    function parseFormattedTimeToMinutes(timeStr) {
      if (!timeStr || typeof timeStr !== "string" || timeStr === "-") return null;
      const m = timeStr.trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i);
      if (!m) return null;
      let hr = parseInt(m[1], 10);
      const min = parseInt(m[2], 10);
      const ampm = m[3] ? m[3].toUpperCase() : null;
      if (min > 59 || (ampm && (hr < 1 || hr > 12)) || (!ampm && hr > 23)) return null;
      if (ampm === "PM" && hr < 12) hr += 12;
      if (ampm === "AM" && hr === 12) hr = 0;
      return hr * 60 + min;
    }

    function computeDutyHoursAndOtFromTimes(startStr, endStr) {
      const startMin = parseFormattedTimeToMinutes(startStr);
      const endMin = parseFormattedTimeToMinutes(endStr);
      if (startMin === null || endMin === null || endMin === startMin) {
        return { workedHours: 0, regularHours: 0, otHours: 0, label: "Enter valid start and end times" };
      }
      const elapsedMinutes = endMin < startMin ? endMin + 24 * 60 - startMin : endMin - startMin;
      const rawHours = Math.round((elapsedMinutes / 60) * 2) / 2; // nearest 0.5 hr
      const regularHours = Math.min(STANDARD_DAILY_DUTY_HOURS, rawHours);
      const otHours = Math.max(0, Number((rawHours - STANDARD_DAILY_DUTY_HOURS).toFixed(1)));
      const label = otHours > 0
        ? `${rawHours} hrs (${STANDARD_DAILY_DUTY_HOURS}h Duty + ${otHours}h OT)`
        : rawHours === STANDARD_DAILY_DUTY_HOURS
        ? `${rawHours} hrs (${STANDARD_DAILY_DUTY_HOURS}-hour daily duty)`
        : `${rawHours} hrs worked (of ${STANDARD_DAILY_DUTY_HOURS}h daily duty)`;
      return { workedHours: rawHours, regularHours, otHours, label };
    }

    // Automatically recalculates staff payroll & Sunday Payouts from Daily Attendance Sheet
    function syncPayrollFromAttendanceSheet(targetStaffId) {
      if (!db || !Array.isArray(db.dailyAttendanceLogs) || !Array.isArray(db.staffPayroll)) return;

      db.staffPayroll.forEach(st => {
        if (targetStaffId && st.id !== targetStaffId) return;
        const staffLogs = db.dailyAttendanceLogs.filter(
          l => l.staffId === st.id && l.status !== "Leave" && (l.dutyStartTime !== "-" || l.status === "Duty Completed" || l.status === "On Duty")
        );
        let loggedDays = 0;
        let loggedOtHours = 0;

        staffLogs.forEach(l => {
          if (l.status === "Half Day") {
            loggedDays += 0.5;
          } else {
            loggedDays += 1;
          }
          if (l.dutyStartTime && l.dutyStartTime !== "-" && l.dutyEndTime && l.dutyEndTime !== "-") {
            const calc = computeDutyHoursAndOtFromTimes(l.dutyStartTime, l.dutyEndTime);
            loggedOtHours += calc.otHours;
          } else if (l.totalHours) {
            const otMatch = String(l.totalHours).match(/\+\s*([\d.]+)\s*h\s*OT/i);
            if (otMatch) {
              loggedOtHours += Number(otMatch[1] || 0);
            }
          }
        });

        st.presentDays = Number(loggedDays.toFixed(1));
        st.otHoursWeek = Number(loggedOtHours.toFixed(1));

        const regPay = st.presentDays * Number(st.dailyWage8Hr || 0);
        const otPay = st.otHoursWeek * Number(st.otHourlyRate || 0);
        const totalSunday = regPay + otPay;

        const pendingSunday = (st.weeklySundayPayouts || []).find(w => w.status !== "Paid");
        if (pendingSunday) {
          pendingSunday.daysWorked8Hr = st.presentDays;
          pendingSunday.dailyRate8Hr = st.dailyWage8Hr;
          pendingSunday.regularPay8Hr = regPay;
          pendingSunday.otHours = st.otHoursWeek;
          pendingSunday.otRatePerHour = st.otHourlyRate;
          pendingSunday.otPay = otPay;
          pendingSunday.totalSundayPayout = totalSunday;
        }
      });
      saveState();
    }

    /*************************************************************************
     * 3. CORE HELPER FUNCTIONS, ROLE ISOLATION & GATEWAY RENDERER

    function t(key) {
      const dict = I18N[session.lang] || I18N.en;
      return dict[key] || key;
    }

    function formatINR(val) {
      const num = Number(val || 0);
      return "₹" + num.toLocaleString("en-IN");
    }

    function showToast(msg, color = "maroon") {
      const container = document.getElementById("toast-container");
      if (!container) return;
      const bgMap = {
        emerald: "bg-emerald-800 border-emerald-400 text-white",
        rose: "bg-rose-800 border-rose-400 text-white",
        amber: "bg-amber-900 border-gold-400 text-white",
        maroon: "bg-maroon-900 border-gold-400 text-white"
      };
      const el = document.createElement("div");
      el.className = `p-3.5 rounded-2xl border-2 shadow-xl text-xs font-extrabold pointer-events-auto silk-enter ${bgMap[color] || bgMap.maroon}`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => {
        el.remove();
      }, 3200);
    }

    function toggleLanguage() {
      session.lang = session.lang === "en" ? "te" : "en";
      render();
    }

    function switchMode(newMode) {
      session.mode = newMode;
      session.loginErrorMsg = "";
      render();
    }

    function selectLoginRoleCard(roleKey) {
      session.selectedLoginRole = roleKey;
      session.loginErrorMsg = "";
      render();
      setTimeout(() => {
        const pwdInput = document.getElementById("gateway-password-input");
        if (pwdInput) {
          pwdInput.value = "";
          pwdInput.focus();
        }
      }, 20);
    }

    function handlePasswordOnlyLogin(e) {
      if (e) e.preventDefault();
      const roleKey = session.selectedLoginRole || "owner";
      const pwdInput = document.getElementById("gateway-password-input");
      const entered = pwdInput ? String(pwdInput.value).trim() : "";
      const cred = db.settings.credentials[roleKey];

      if (!cred || entered !== String(cred.password).trim()) {
        session.loginErrorMsg = `❌ Access Denied: Incorrect password for ${cred ? cred.name : roleKey.toUpperCase()}. Please enter the exact password.`;
        render();
        setTimeout(() => {
          const formBox = document.getElementById("gateway-login-form-box");
          if (formBox) formBox.classList.add("shake-error");
        }, 10);
        return false;
      }

      session.loginErrorMsg = "";
      session.user = { ...cred };
      session.mode = "staff";
      session.tabHistory = [];
      const allowed = ROLE_PERMISSIONS[roleKey] || ["workshop"];
      session.activeTab = allowed[0];
      autoRecordStaffLoginAttendance(cred);
      showToast(`🔓 Welcome ${cred.name}!`, "emerald");
      render();
      return false;
    }

    function logoutStaff() {
      session.user = null;
      session.mode = "gateway";
      session.tabHistory = [];
      session.loginErrorMsg = "";
      render();
    }

    function setStaffTab(tabKey) {
      if (session.activeTab && session.activeTab !== tabKey) {
        session.tabHistory.push(session.activeTab);
      }
      session.activeTab = tabKey;
      render();
    }

    function goBackAfterLogin() {
      if (session.tabHistory && session.tabHistory.length > 0) {
        session.activeTab = session.tabHistory.pop();
        render();
      } else {
        logoutStaff();
      }
    }

    function canAccessModule(role, tabKey) {
      const allowed = ROLE_PERMISSIONS[role] || [];
      return allowed.includes(tabKey);
    }

    function canViewCustomerProfilePhoto() {
      if (session.mode === "customer" && session.customerOtpVerified) return true;
      if (session.mode === "staff" && session.user?.role === "owner") return true;
      return false;
    }

    function getCustomerServiceCount(custId, mobile) {
      return db.orders.filter(o => o.customerId === custId || o.customerMobile === mobile).length;
    }

    function getWorkflowForService(serviceType) {
      if (serviceType === "Maggam Work + Blouse Stitching") {
        return MAGGAM_PLUS_STITCHING_WORKFLOW;
      }
      return STITCHING_ONLY_WORKFLOW;
    }

    function sanitizeOrderForRole(order, explicitRole) {
      const role = explicitRole || session.user?.role || "owner";
      const clone = safeJsonParse(JSON.stringify(order));
      if (role === "stitching" || role === "maggam") {
        clone.customerMobile = "[RESTRICTED]";
        clone.customerAddress = "[RESTRICTED]";
        clone.totalAmount = 0;
        clone.advancePaid = 0;
        clone.payments = [];
        clone.invoiceItems = [];
      } else if (role === "madam") {
        clone.totalAmount = 0;
        clone.advancePaid = 0;
        clone.payments = [];
        clone.invoiceItems = [];
      }
      return clone;
    }

    function canUserSeeOrderInWorkshop(order, role) {
      if (role === "owner" || role === "madam") return true;
      if (role === "maggam") {
        return (
          order.serviceType === "Maggam Work + Blouse Stitching" &&
          MAGGAM_VISIBLE_STAGES.includes(order.status)
        );
      }
      if (role === "stitching") {
        if (order.serviceType === "Maggam Work + Blouse Stitching") {
          return STITCHING_VISIBLE_STAGES.includes(order.status) && order.status !== "Booking";
        }
        return STITCHING_VISIBLE_STAGES.includes(order.status);
      }
      return false;
    }

    function getAllowedStatusesForRole(order, role) {
      const flow = getWorkflowForService(order.serviceType);
      if (role === "owner" || role === "madam") return flow;
      if (role === "maggam") {
        return ["Booking", "Maggam Assigned", "Maggam In Progress", "Maggam Completed"];
      }
      if (role === "stitching") {
        return ["Stitching Assigned", "Stitching In Progress", "Stitching Completed"];
      }
      return [order.status];
    }

    function getNextQuickStepForRole(order, role) {
      const allowed = getAllowedStatusesForRole(order, role);
      const idx = allowed.indexOf(order.status);
      if (idx >= 0 && idx < allowed.length - 1) {
        return allowed[idx + 1];
      }
      return null;
    }

    function updateOrderStatus(orderId, newStatus) {
      const order = db.orders.find(o => o.id === orderId);
      if (!order) return;
      const role = session.user?.role || "owner";
      const allowed = getAllowedStatusesForRole(order, role);
      if (!allowed.includes(newStatus)) {
        showToast("Unauthorized status transition for your role.", "rose");
        return;
      }

      const nowStr = new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" });
      if (newStatus === "Ready for Delivery") {
        order.completedDate = new Date().toISOString().slice(0, 10);
      } else if (order.status === "Ready for Delivery" && newStatus !== "Delivered") {
        order.completedDate = "";
      }
      if (newStatus === "Maggam Completed") {
        order.status = "Stitching Assigned";
        order.historyLog.unshift({
          time: nowStr,
          text: `Maggam Completed by ${session.user?.name || "Maggam Staff"} → ⚡ Automatically transferred to Stitching Assigned (Silent update, zero SMS)`
        });
        saveState();
        showToast(`✨ ${order.id}: Maggam Completed! Automatically transferred to Stitching Department.`, "emerald");
      } else {
        order.status = newStatus;
        order.historyLog.unshift({
          time: nowStr,
          text: `Status updated to "${newStatus}" by ${session.user?.name || role} (No auto-SMS)`
        });
        saveState();
        showToast(`Updated ${order.id} status to ${newStatus}`, "emerald");
      }
      render();
    }

    function getOrderUrgentMeta(order) {
      if (!order || order.status === "Delivered") {
        return { isUrgent: false, daysLeft: 999, label: "" };
      }
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const deliv = new Date((order.deliveryDate || "2026-11-20") + "T00:00:00");
      const diffDays = Math.ceil((deliv - today) / (1000 * 60 * 60 * 24));
      const within10Days = diffDays <= 10;
      const isUrgent = Boolean(order.isUrgentAllocated || within10Days);
      let label = "";
      if (order.isUrgentAllocated && within10Days) {
        label = `Special Urgent • Due ${order.deliveryDate}`;
      } else if (order.isUrgentAllocated) {
        label = order.urgentNote || "Special Urgent Allocation";
      } else if (within10Days) {
        label = `Next 10 Days Delivery (${order.deliveryDate})`;
      }
      return { isUrgent, daysLeft: diffDays, label };
    }

    function sortOrdersByUrgentSequence(ordersList) {
      return [...ordersList].sort((a, b) => {
        const ua = getOrderUrgentMeta(a);
        const ub = getOrderUrgentMeta(b);
        if (ua.isUrgent !== ub.isUrgent) return ua.isUrgent ? -1 : 1;
        if (a.deliveryDate !== b.deliveryDate) {
          return String(a.deliveryDate).localeCompare(String(b.deliveryDate));
        }
        return String(b.id).localeCompare(String(a.id));
      });
    }

    function toggleSpecialUrgentAllocation(orderId) {
      const role = session.user?.role;
      if (role !== "owner" && role !== "madam") {
        showToast("Only Owner or Madam can change Special Urgent Allocation.", "rose");
        return;
      }
      const ord = db.orders.find(o => o.id === orderId);
      if (!ord) return;
      ord.isUrgentAllocated = !ord.isUrgentAllocated;
      ord.urgentNote = ord.isUrgentAllocated ? `Allocated Urgent by ${session.user?.name}` : "";
      saveState();
      showToast(
        ord.isUrgentAllocated
          ? `🚨 Marked ${ord.id} as URGENT Delivery for Maggam & Stitching!`
          : `Removed special urgent tag from ${ord.id}.`,
        ord.isUrgentAllocated ? "rose" : "amber"
      );
      render();
    }

    function deleteOrderRecord(orderId) {
      const idx = db.orders.findIndex(o => o.id === orderId);
      if (idx === -1) return;
      const removed = db.orders.splice(idx, 1)[0];
      saveState();
      closeModal();
      showToast(`🗑️ Permanently deleted Order ${removed.id}.`, "rose");
      render();
    }

    function deleteCustomerRecord(custId) {
      if (db.customers.length <= 1) {
        showToast("At least one customer must remain in the directory.", "amber");
        return;
      }
      const idx = db.customers.findIndex(c => c.id === custId);
      if (idx === -1) return;
      const removed = db.customers.splice(idx, 1)[0];
      session.selectedCustomerId = db.customers[0].id;
      saveState();
      showToast(`🗑️ Permanently deleted Customer ${removed.name} (${removed.id}).`, "rose");
      render();
    }

    function deleteExpenseRecord(expId) {
      const idx = db.expenses.findIndex(e => e.id === expId);
      if (idx === -1) return;
      const removed = db.expenses.splice(idx, 1)[0];
      saveState();
      showToast(`🗑️ Permanently deleted Expense ${removed.id}.`, "rose");
      render();
    }

        { key: "reports", icon: "📑", label: t("reports") }
      ].filter(item => allowedTabs.includes(item.key));

        session.activeTab = allowedTabs[0];
      }

        .filter(ex => ex.createdByRole === role)
        .reduce((sum, ex) => sum + Number(ex.amount || 0), 0);

      const hasPrevTab = session.tabHistory && session.tabHistory.length > 0;

      return `

                  class="px-3.5 py-2 rounded-xl bg-gold-500 hover:bg-gold-400 text-maroon-900 text-xs font-extrabold shadow-md flex items-center gap-1.5 cursor-pointer"
                  title="${hasPrevTab ? 'Go Back to Previous Screen' : 'Back to Login Selection'}">
                  <span>← Back</span>
                </button>
                <img src="${session.user.avatar || 'https://placehold.co/80x80/d4a024/4a0b17?text=ST'}"

                  <div class="flex flex-wrap items-center gap-2">
                    <h1 class="serif-title font-bold text-base sm:text-lg">${session.user.name}</h1>

                    <span class="px-2 py-0.5 rounded-md bg-white/15 text-[11px] font-semibold">${SINGLE_BRANCH_NAME}</span>
                  </div>
                  <p class="text-[11px] text-amber-200">
                    ${session.user.designation || "Boutique Staff"} • ID: <strong>${session.user.staffId}</strong> • My Logged Expenses: <strong>${formatINR(myExpensesTotal)}</strong>
                  </p>
                </div>
              </div>

              <!-- Actions -->
              <div class="flex flex-wrap items-center gap-2">
                <div class="server-status-indicator px-2.5 py-1 rounded-lg text-[10px] font-extrabold flex items-center gap-1.5 ${serverConnected ? 'bg-emerald-600/30 text-emerald-300 border border-emerald-400/40' : 'bg-rose-600/30 text-rose-300 border border-rose-400/40'}">
                  <span class="w-2 h-2 rounded-full ${serverConnected ? 'bg-emerald-400 animate-pulse' : 'bg-rose-400'}"></span>
                  <span>${serverConnected ? 'Server Online (SQLite Sync)' : 'Server Connecting...'}</span>
                </div>
                <button onclick="logoutStaff()" class="px-3.5 py-1.5 rounded-xl bg-white/15 hover:bg-white/25 border border-white/20 text-white text-xs font-bold cursor-pointer">

                <button onclick="toggleLanguage()" class="px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-semibold cursor-pointer">
                  🌐 ${session.lang === "en" ? "తెలుగు" : "EN"}

                <button onclick="logoutStaff()" class="px-3.5 py-1.5 rounded-xl bg-rose-700 hover:bg-rose-600 text-white text-xs font-bold cursor-pointer">
                  ${t("logout")}

              </div>
            </div>

            <!-- Navigation Tabs -->
            <div class="bg-maroon-800 border-t border-white/10">
              <div class="max-w-7xl mx-auto px-4 flex items-center gap-1 overflow-x-auto py-1.5">
                ${allNavItems.map(item => {
                  const active = session.activeTab === item.key;
                  return `
                    <button onclick="setStaffTab('${item.key}')"
                      class="px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition flex items-center gap-1.5 cursor-pointer ${
                        active
                          ? "bg-gold-500 text-maroon-900 shadow-xs"
                          : "text-amber-100 hover:bg-white/10"
                      }">
                      <span>${item.icon}</span>
                      <span>${item.label}</span>
                    </button>
                  `;
                }).join("")}
              </div>
            </div>
          </header>

          <!-- Main Content Area -->
          <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 silk-enter">
            ${renderStaffIdentityStrip()}
            ${renderActiveStaffTab()}
          </main>
        </div>
      `;
    }

    function renderStaffIdentityStrip() {
      const u = session.user;
      if (!u) return "";
      const role = u.role;
      const myExpenses = db.expenses.filter(ex => ex.createdByRole === role);
      const myExpTotal = myExpenses.reduce((s, e) => s + Number(e.amount || 0), 0);
      const payrollRec = db.staffPayroll.find(p => p.id === u.staffId);
      const todayIso = new Date().toISOString().slice(0, 10);
      const myTodayAtt = (db.dailyAttendanceLogs || []).find(
        l => l.date === todayIso && (l.staffId === u.staffId || l.role === role)
      );

      return `
        <div class="mb-5 bg-white rounded-2xl p-4 border border-stone-200 shadow-2xs flex flex-wrap items-center justify-between gap-4 no-print">
          <div class="flex items-center gap-3.5">
            <img src="${u.avatar || 'https://placehold.co/96x96/801326/ffffff?text=U'}"
              alt="${u.name}"
              class="w-14 h-14 rounded-2xl object-cover border-2 border-maroon-700" />
            <div>
              <div class="flex flex-wrap items-center gap-2">
                <span class="text-sm sm:text-base font-extrabold text-slate-900">${u.name}</span>
                <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold uppercase bg-maroon-100 text-maroon-800">${u.staffId} • ${role.toUpperCase()}</span>
                <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-emerald-100 text-emerald-900">
                  🕒 Login: ${myTodayAtt ? myTodayAtt.loginTime : "Active"} | Start: ${myTodayAtt ? myTodayAtt.dutyStartTime : "-"} | End: ${myTodayAtt ? myTodayAtt.dutyEndTime : "-"}
                </span>
              </div>
              <p class="text-xs text-slate-600 mt-0.5">${u.designation || "Boutique Staff"} • 📱 ${u.phone || "-"} • Joined: ${u.joinedDate || "2022"}</p>
              ${payrollRec && role === "owner" ? `
                <p class="text-[11px] text-emerald-800 font-semibold mt-0.5">
                  Duty: ${payrollRec.standardDailyHours || STANDARD_DAILY_DUTY_HOURS} Hrs/Day (${payrollRec.presentDays} Days) ${
                    payrollRec.payoutCycle && payrollRec.payoutCycle.includes("Sunday")
                      ? `• Extra OT: ${payrollRec.otHoursWeek} Hrs × ${formatINR(payrollRec.otHourlyRate)}/hr • Sunday Payout: ${formatINR((payrollRec.presentDays * payrollRec.dailyWage8Hr) + (payrollRec.otHoursWeek * payrollRec.otHourlyRate))}`
                      : `• Monthly Salary: ${formatINR(payrollRec.baseSalary)}`
                  }
                </p>
              ` : ""}
            </div>
          </div>

          <div class="flex flex-wrap items-center gap-2">
            <button onclick="goBackAfterLogin()"
              class="px-3 py-2 rounded-xl bg-stone-200 hover:bg-stone-300 text-slate-900 text-xs font-extrabold cursor-pointer">
              ← Back
            </button>
            <button onclick="markMyDutyStart()"
              class="px-3 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-extrabold cursor-pointer"
              title="Record Started Duty Time">
              🟢 Start Duty
            </button>
            <button onclick="markMyDutyEnd()"
              class="px-3 py-2 rounded-xl bg-rose-700 hover:bg-rose-800 text-white text-xs font-extrabold cursor-pointer"
              title="Record End Duty Time">
              🔴 End Duty
            </button>
            <div class="px-3 py-1.5 rounded-xl bg-stone-50 border border-stone-200 text-right">
              <div class="text-[10px] font-bold uppercase text-slate-500">My Expenses (${myExpenses.length})</div>
              <div class="text-xs font-extrabold text-rose-700">${formatINR(myExpTotal)}</div>
            </div>
            <button onclick="openEditStaffProfileModal('${role}')"
              class="px-3 py-2 rounded-xl bg-gradient-to-r from-gold-400 to-amber-500 hover:from-gold-500 hover:to-amber-400 text-maroon-900 text-xs font-extrabold shadow-xs cursor-pointer">
              ✏️ Edit Profile
            </button>
            <button onclick="openAddExpenseModal()"
              class="px-3 py-2 rounded-xl bg-maroon-700 hover:bg-maroon-800 text-white text-xs font-bold cursor-pointer">
              + My Expense
            </button>
          </div>
        </div>
      `;
    }

    function renderActiveStaffTab() {
      const role = session.user.role;
      if (!canAccessModule(role, session.activeTab)) {
        return `<div class="p-8 bg-white rounded-2xl border border-rose-200 text-rose-700 font-bold">Unauthorized module for ${role}.</div>`;
      }

      switch (session.activeTab) {
        case "dashboard": return renderDashboardTab();
        case "myprofile": return renderMyProfileAndExpensesTab();
        case "orders": return renderOrdersTab();
        case "customers": return renderCustomersTab();
        case "workshop": return renderWorkshopTab();
        case "billing": return renderBillingTab();
        case "hr": return renderHrTab();
        case "finance": return renderFinanceTab();
        case "reports": return renderReportsTab();
        default: return renderDashboardTab();
      }
    }

    /*************************************************************************
     * 6B. STAFF PERSONAL PROFILE, DETAILS & OWN EXPENSES TAB (ALL 4 LOGINS)
     *************************************************************************/
    function renderMyProfileAndExpensesTab() {
      const u = session.user;
      const role = u.role;
      const isOwner = role === "owner";
      const myExpenses = db.expenses.filter(ex => ex.createdByRole === role);
      const myExpTotal = myExpenses.reduce((s, e) => s + Number(e.amount || 0), 0);
      const payrollRec = db.staffPayroll.find(p => p.id === u.staffId);

      return `
        <div class="space-y-6">

                <div class="flex items-center gap-4">
                  <img src="${u.avatar || 'https://placehold.co/120x120/801326/ffffff?text=ST'}"

                    <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase bg-maroon-100 text-maroon-800">
                      ${u.staffId} • ${role.toUpperCase()} LOGIN
                    </span>
                    <h2 class="text-lg font-extrabold text-slate-900 mt-1">${u.name}</h2>
                    <p class="text-xs text-slate-600">${u.designation || "Boutique Staff"}</p>
                  </div>
                </div>
                <button onclick="openEditStaffProfileModal('${role}')"

              </div>

              <div class="space-y-2.5 text-xs">
                <div class="p-3 rounded-xl bg-stone-50 border border-stone-200 flex justify-between">
                  <span class="text-slate-500 font-semibold">Login Role Key:</span>
                  <span class="font-mono font-bold text-maroon-800 uppercase">${u.role}</span>
                </div>
                ${isOwner ? `
                  <div class="p-3 rounded-xl bg-stone-50 border border-stone-200 flex justify-between items-center">
                    <span class="text-slate-500 font-semibold">Current Login Password:</span>
                    <span class="font-mono font-extrabold text-maroon-900 bg-amber-100 px-2.5 py-0.5 rounded">${u.password}</span>
                  </div>
                ` : `
                  <div class="p-3 rounded-xl bg-stone-50 border border-stone-200 flex justify-between">

                    <span class="font-semibold text-slate-500">Managed by Owner</span>
                  </div>
                `}
                <div class="p-3 rounded-xl bg-stone-50 border border-stone-200 flex justify-between">
                  <span class="text-slate-500 font-semibold">Branch Assigned:</span>
                  <span class="font-bold text-slate-900">${SINGLE_BRANCH_NAME}</span>
                </div>
                <div class="p-3 rounded-xl bg-stone-50 border border-stone-200 flex justify-between">
                  <span class="text-slate-500 font-semibold">Contact Mobile:</span>
                  <span class="font-mono font-bold text-slate-900">${u.phone || "-"}</span>
                </div>
                <div class="p-3 rounded-xl bg-stone-50 border border-stone-200 flex justify-between">
                  <span class="text-slate-500 font-semibold">Joined Date:</span>
                  <span class="font-bold text-slate-900">${u.joinedDate || "2022-01-01"}</span>
                </div>
                ${payrollRec && isOwner ? `
                  <div class="p-3 rounded-xl bg-emerald-50 border border-emerald-200 space-y-1">
                    <div class="font-extrabold text-emerald-900">My Attendance, 11-Hr Duty & Extra OT Summary</div>
                    <div class="flex justify-between"><span>Payout Schedule:</span><strong>${payrollRec.payoutCycle || "Every Sunday"}</strong></div>
                    <div class="flex justify-between"><span>Standard Daily Duty:</span><strong>${payrollRec.standardDailyHours || STANDARD_DAILY_DUTY_HOURS} Hours / Day</strong></div>
                    <div class="flex justify-between"><span>Days Worked (11-Hr Shift):</span><strong>${payrollRec.presentDays} Days × ${formatINR(payrollRec.dailyWage8Hr || 0)} = ${formatINR((payrollRec.presentDays || 0) * (payrollRec.dailyWage8Hr || 0))}</strong></div>
                    <div class="flex justify-between"><span>Extra OT Hours This Week:</span><strong>${payrollRec.otHoursWeek || 0} Hrs × ${formatINR(payrollRec.otHourlyRate || 0)}/hr = ${formatINR((payrollRec.otHoursWeek || 0) * (payrollRec.otHourlyRate || 0))}</strong></div>
                    <div class="flex justify-between pt-1 border-t border-emerald-200 text-maroon-900"><span>This Sunday Net Payout:</span><strong class="text-sm">${formatINR(((payrollRec.presentDays || 0) * (payrollRec.dailyWage8Hr || 0)) + ((payrollRec.otHoursWeek || 0) * (payrollRec.otHourlyRate || 0)))}</strong></div>
                  </div>

              </div>

            <!-- Right: Personal Expenses Logged Under This Login Only -->
            <div class="lg:col-span-7 bg-white rounded-2xl p-6 border border-stone-200 space-y-4">
              <div class="flex flex-wrap items-center justify-between gap-3 border-b border-stone-200 pb-4">
                <div>
                  <span class="text-[11px] font-bold uppercase tracking-wider text-maroon-700">Isolated Login Expense Ledger</span>

                  <p class="text-xs text-slate-500">Only expenses created in your login (${role.toUpperCase()}) are displayed here.</p>
                </div>
                <button onclick="openAddExpenseModal()"
                  class="px-4 py-2.5 rounded-xl bg-maroon-700 hover:bg-maroon-800 text-white text-xs font-bold cursor-pointer">

                </button>
              </div>

              <div class="p-4 rounded-2xl bg-rose-50 border border-rose-200 flex items-center justify-between">
                <span class="text-xs font-bold text-rose-900">Total Expenses Logged by ${u.name}:</span>
                <span class="text-lg font-extrabold text-rose-700">${formatINR(myExpTotal)}</span>
              </div>

              <div class="space-y-2.5">
                ${myExpenses.length === 0 ? `
                  <div class="p-8 text-center text-xs text-slate-500 bg-stone-50 rounded-xl border border-stone-200">

          ${isOwner ? renderOwnerAllLoginsManagerWidget() : ""}
        </div>
      `;

              <h3 class="serif-title text-lg font-bold mt-1">🔑 All 4 Staff Logins — Names, Profiles, Passwords & Salaries</h3>

                <div class="p-4 rounded-2xl bg-gradient-to-b from-amber-50/40 to-stone-50 border border-stone-200 flex flex-col justify-between gap-3 shadow-2xs">

                    <div class="flex items-center gap-3">
                      <img src="${cred.avatar || 'https://placehold.co/80x80/801326/ffffff?text=U'}"

                      <div>
                        <span class="px-2 py-0.5 rounded bg-maroon-900 text-gold-400 text-[10px] font-extrabold uppercase">${cred.role} LOGIN</span>

                            <span class="text-emerald-900 font-semibold">11-Hr Shift / OT:</span>
                            <strong class="font-mono text-emerald-900">${formatINR(payrollRec.dailyWage8Hr)}/d • ${formatINR(payrollRec.otHourlyRate)}/hr</strong>

                      </div>
                    </div>
                  </div>

                  <button onclick="openEditStaffProfileModal('${rKey}')"
                    class="w-full py-2.5 px-3 rounded-xl bg-gradient-to-r from-maroon-800 to-maroon-700 hover:from-maroon-900 hover:to-maroon-800 text-gold-400 text-xs font-extrabold shadow-xs cursor-pointer">
                    ✏️ Edit Profile, Password & Salary
                  </button>
                </div>
              `;
            }).join("")}
          </div>

      `;

    function openEditStaffProfileModal(targetRoleKey) {
      const currentRole = session.user?.role;
      const isOwner = currentRole === "owner";
      if (!isOwner && currentRole !== targetRoleKey) {
        showToast("You can only edit your own login profile and password.", "rose");
        return;
      }
      const cred = db.settings.credentials[targetRoleKey];
      if (!cred) return;
      const payrollRec = db.staffPayroll.find(p => p.id === cred.staffId);

      openModalHtml(`
        <div class="bg-white rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-2xl border-2 border-gold-400/70 text-xs max-h-[92vh] overflow-y-auto silk-enter">
          <div class="h-1.5 w-full zari-border rounded-full mb-4"></div>
          <div class="flex items-center justify-between border-b border-stone-200 pb-3">
            <div>
              <span class="px-2.5 py-0.5 rounded-full bg-maroon-100 text-maroon-800 text-[10px] font-extrabold uppercase">
                ${targetRoleKey.toUpperCase()} LOGIN • ${isOwner ? "PROFILE, PASSWORD & SALARY EDITOR" : "PROFILE EDITOR"}
              </span>
              <h3 class="text-base font-extrabold text-slate-900 mt-1">Edit ${cred.name}</h3>
            </div>
            <button type="button" onclick="closeModal()" class="px-3 py-1.5 rounded-xl bg-stone-100 hover:bg-stone-200 font-bold cursor-pointer">✕</button>
          </div>

              <img id="edit-staff-avatar-preview" src="${cred.avatar}" class="w-16 h-16 rounded-2xl object-cover border-2 border-maroon-700" />
              <div class="flex-1 space-y-1.5">

                <input type="file" accept="image/*" onchange="handleStaffAvatarUpload(event)" class="text-[11px] w-full" />

              <div class="sm:col-span-2">
                <label class="block font-bold text-slate-700 mb-1">Staff / Login Display Name</label>

              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1">Designation / Role Title</label>
                <input type="text" name="designation" value="${cred.designation || ''}" required

    function handleStaffAvatarUpload(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const dataUrl = evt.target.result;
        const preview = document.getElementById("edit-staff-avatar-preview");
        const hidden = document.getElementById("edit-staff-avatar-data");
        if (preview) preview.src = dataUrl;
        if (hidden) hidden.value = dataUrl;
      };
      reader.readAsDataURL(file);
    }

    function submitEditStaffProfile(e, targetRoleKey) {
      e.preventDefault();
      const cred = db.settings.credentials[targetRoleKey];
      if (!cred) return;
      const fd = new FormData(e.target);
      const oldName = cred.name;
      const newName = String(fd.get("name") || cred.name).trim();
      const isOwner = session.user?.role === "owner";
      const newPwd = isOwner ? String(fd.get("password") || "").trim() : "";

      if (isOwner && !newPwd) {
        showToast("Password cannot be empty!", "rose");
        return;
      }

      if (!isOwner && targetRoleKey !== session.user?.role) {
        showToast("Only the Owner can edit another login.", "rose");
        return;
      }

      cred.name = newName;
      cred.designation = String(fd.get("designation") || cred.designation).trim();
      cred.phone = String(fd.get("phone") || cred.phone).trim();
      if (isOwner) cred.password = newPwd;
      cred.avatar = fd.get("avatar") || cred.avatar;

      // Sync payroll record name and salary fields if edited by Owner
      const payrollRec = db.staffPayroll.find(p => p.id === cred.staffId);
      if (payrollRec) {
        payrollRec.name = cred.name;
        if (session.user?.role === "owner") {
          if (fd.get("baseSalary") !== null) payrollRec.baseSalary = Number(fd.get("baseSalary"));
          if (fd.get("dailyWage8Hr") !== null) payrollRec.dailyWage8Hr = Number(fd.get("dailyWage8Hr"));
          if (fd.get("otHourlyRate") !== null) payrollRec.otHourlyRate = Number(fd.get("otHourlyRate"));
          if (fd.get("presentDays") !== null) payrollRec.presentDays = Number(fd.get("presentDays"));
          if (fd.get("otHoursWeek") !== null) payrollRec.otHoursWeek = Number(fd.get("otHoursWeek"));
          if (fd.get("paidThisMonth") !== null) payrollRec.paidThisMonth = Number(fd.get("paidThisMonth"));

          // Recalculate pending Sunday payout row automatically
          const pendingSunday = (payrollRec.weeklySundayPayouts || []).find(w => w.status !== "Paid");
          if (pendingSunday) {
            pendingSunday.daysWorked8Hr = payrollRec.presentDays;
            pendingSunday.dailyRate8Hr = payrollRec.dailyWage8Hr;
            pendingSunday.regularPay8Hr = payrollRec.presentDays * payrollRec.dailyWage8Hr;
            pendingSunday.otHours = payrollRec.otHoursWeek;
            pendingSunday.otRatePerHour = payrollRec.otHourlyRate;
            pendingSunday.otPay = payrollRec.otHoursWeek * payrollRec.otHourlyRate;
            pendingSunday.totalSundayPayout = pendingSunday.regularPay8Hr + pendingSunday.otPay;
          }
        }
      }

      // Sync assigned staff names in orders if name changed
      if (oldName !== newName) {
        db.orders.forEach(o => {
          if (o.assignedMaggam === oldName) o.assignedMaggam = newName;
          if (o.assignedStitching === oldName) o.assignedStitching = newName;
        });
      }

      // Sync active session if editing own profile
      if (session.user && session.user.role === targetRoleKey) {
        session.user = { ...cred };
      }

      saveState();
      closeModal();
      showToast(isOwner
        ? `✅ Saved ${targetRoleKey.toUpperCase()} Profile, Password & Salary!`
        : `✅ Saved your ${targetRoleKey.toUpperCase()} profile. Login password is managed by the Owner.`, "emerald");
      render();
    }

    function filterCustomerList(val) {
      const q = (val || "").trim().toLowerCase();
      const match = db.customers.find(c => c.mobile.includes(q) || c.name.toLowerCase().includes(q));
      if (match) {
        session.selectedCustomerId = match.id;
        render();
        const box = document.getElementById("customer-search-box");
        if (box) {
          box.value = val;
          box.focus();
        }
      }
    }

    function saveCustomer14Measurements(e, custId) {
      e.preventDefault();
      const cust = db.customers.find(c => c.id === custId);
      if (!cust) return;
      const fd = new FormData(e.target);
      const updated = { ...cust.measurements };
      Object.keys(GARMENT_MEASUREMENT_SCHEMAS).forEach(sKey => {
        GARMENT_MEASUREMENT_SCHEMAS[sKey].fields.forEach(f => {
          const val = fd.get(f.key);
          if (val !== null) updated[f.key] = val;
        });
      });
      cust.measurements = updated;
      cust.measurementHistory.unshift({
        date: new Date().toISOString().slice(0, 10),
        note: fd.get("historyNote") || `Updated ${getOutfitLabel(session.customerMeasurementOutfitKey)} Measurements`,
        values: { ...updated }
      });
      showToast(`Saved ${getOutfitLabel(session.customerMeasurementOutfitKey)} measurements for ${cust.name}`, "emerald");
      saveState();
      render();
    }

    function playOrderVoiceNote(orderId) {
      const raw = db.orders.find(o => o.id === orderId);
      if (!raw) return;

      const badge = document.getElementById(`vn-status-${orderId}`);
      if (badge) badge.classList.remove("hidden");

      // 1. If a real recorded voice audio clip exists on the order, play it directly
      if (raw.voiceAudioDataUrl) {
        try {
          const audio = new Audio(raw.voiceAudioDataUrl);
          audio.onended = () => {
            if (badge) badge.classList.add("hidden");
          };
          audio.onerror = () => {
            if (badge) badge.classList.add("hidden");
          };
          audio.play();
          showToast(`🔊 Playing Recorded Voice Clip (${raw.voiceNoteDuration || "Audio"})${raw.voiceNoteTranscript ? ': "' + raw.voiceNoteTranscript + '"' : ""}`, "emerald");
          return;
        } catch (err) {}
      }

      // 2. Otherwise play chime + speak the written note (if provided)
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          const ctx = new AudioCtx();
          const now = ctx.currentTime;
          [523.25, 659.25, 783.99].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(freq, now + i * 0.14);
            gain.gain.setValueAtTime(0.12, now + i * 0.14);
            gain.gain.exponentialRampToValueAtTime(0.001, now + (i + 1) * 0.14);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.14);
            osc.stop(now + (i + 1) * 0.14);
          });
        }
      } catch (e) {}

      const noteText = (raw.voiceNoteTranscript || "").trim();
      if ("speechSynthesis" in window && noteText && noteText !== "No written note") {
        try {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(noteText);
          utter.rate = 0.95;
          utter.onend = () => {
            if (badge) badge.classList.add("hidden");
          };
          window.speechSynthesis.speak(utter);
        } catch (err) {
          setTimeout(() => {
            if (badge) badge.classList.add("hidden");
          }, 2500);
        }
      } else {
        setTimeout(() => {
          if (badge) badge.classList.add("hidden");
        }, 1800);
      }

      showToast(
        noteText
          ? `🔊 Playing Note (${raw.voiceNoteDuration || "Note"}): "${noteText}"`
          : `ℹ️ No voice recording or written note was attached to Order ${raw.id}.`,
        "emerald"
      );
    }

    function submitNewInvoiceLineItem(e, orderId) {
      e.preventDefault();
      const o = db.orders.find(x => x.id === orderId);
      if (!o) return;
      const fd = new FormData(e.target);
      const title = (fd.get("title") || "Boutique Service").trim();
      const amount = Number(fd.get("amount") || 0);
      if (!o.invoiceItems) o.invoiceItems = [];
      o.invoiceItems.push({ title, amount });
      o.totalAmount = o.invoiceItems.reduce((s, i) => s + Number(i.amount || 0), 0);
      showToast(`Added "${title}" (${formatINR(amount)}) to ${o.id} Common Invoice!`, "emerald");
      openEditInvoiceItemsModal(orderId);
      render();
    }

    function removeInvoiceLineItem(orderId, idx) {
      const o = db.orders.find(x => x.id === orderId);
      if (!o || !o.invoiceItems) return;
      o.invoiceItems.splice(idx, 1);
      o.totalAmount = o.invoiceItems.reduce((s, i) => s + Number(i.amount || 0), 0);
      openEditInvoiceItemsModal(orderId);
      render();
    }

    function submitDirectTotalOverride(e, orderId) {
      e.preventDefault();
      const o = db.orders.find(x => x.id === orderId);
      if (!o) return;
      const fd = new FormData(e.target);
      o.totalAmount = Number(fd.get("totalAmount") || 0);
      if (!o.invoiceItems || o.invoiceItems.length === 0) {
        o.invoiceItems = [{ title: o.serviceType, amount: o.totalAmount }];

    function submitWeeklyOtUpdate(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const staffId = fd.get("staffId");
      const st = db.staffPayroll.find(x => x.id === staffId);
      if (!st) return;

      st.presentDays = Number(fd.get("presentDays") || 6);
      st.dailyWage8Hr = Number(fd.get("dailyWage8Hr") || 650);
      st.otHoursWeek = Number(fd.get("otHoursWeek") || 0);
      st.otHourlyRate = Number(fd.get("otHourlyRate") || 100);
      const weekLabel = (fd.get("weekLabel") || "Upcoming Sunday").trim();

      const regPay = st.presentDays * st.dailyWage8Hr;
      const otPay = st.otHoursWeek * st.otHourlyRate;
      const total = regPay + otPay;

      if (!st.weeklySundayPayouts) st.weeklySundayPayouts = [];
      const existing = st.weeklySundayPayouts.find(w => w.weekLabel === weekLabel);
      if (existing) {
        existing.daysWorked8Hr = st.presentDays;
        existing.dailyRate8Hr = st.dailyWage8Hr;
        existing.regularPay8Hr = regPay;
        existing.otHours = st.otHoursWeek;
        existing.otRatePerHour = st.otHourlyRate;
        existing.otPay = otPay;
        existing.totalSundayPayout = total;
      } else {
        st.weeklySundayPayouts.unshift({
          weekLabel,
          sundayDate: new Date().toISOString().slice(0, 10),
          daysWorked8Hr: st.presentDays,
          dailyRate8Hr: st.dailyWage8Hr,
          regularPay8Hr: regPay,
          otHours: st.otHoursWeek,
          otRatePerHour: st.otHourlyRate,
          otPay,
          totalSundayPayout: total,
          status: "Due This Sunday",
          mode: "Pending"
        });
      }

      closeModal();
      showToast(`Saved 11-Hr shift + ${st.otHoursWeek}h OT for ${st.name} (Sunday Total: ${formatINR(total)})`, "emerald");
      render();
    }

    function recordSundayWeeklyPayout(staffId) {
      const st = db.staffPayroll.find(x => x.id === staffId);
      if (!st) return;
      const regPay = Number(st.presentDays || 0) * Number(st.dailyWage8Hr || 0);
      const otPay = Number(st.otHoursWeek || 0) * Number(st.otHourlyRate || 0);
      const total = regPay + otPay;

      const pendingRow = (st.weeklySundayPayouts || []).find(w => w.status !== "Paid");
      if (pendingRow) {
        pendingRow.status = "Paid";
        pendingRow.mode = "Cash/UPI";
      } else {
        st.weeklySundayPayouts.unshift({
          weekLabel: `Sunday Payout (${new Date().toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" })})`,
          sundayDate: new Date().toISOString().slice(0, 10),
          daysWorked8Hr: st.presentDays,
          dailyRate8Hr: st.dailyWage8Hr,
          regularPay8Hr: regPay,
          otHours: st.otHoursWeek,
          otRatePerHour: st.otHourlyRate,
          otPay,
          totalSundayPayout: total,
          status: "Paid",
          mode: "Cash/UPI"
        });
      }

      st.paidThisMonth = Number(st.paidThisMonth || 0) + total;
      showToast(`Paid Sunday Weekly Payout of ${formatINR(total)} to ${st.name}!`, "emerald");
      saveState();
      render();
    }

    function markSundayWeekRowPaid(staffId, rowIdx) {
      const st = db.staffPayroll.find(x => x.id === staffId);
      if (!st || !st.weeklySundayPayouts || !st.weeklySundayPayouts[rowIdx]) return;
      const row = st.weeklySundayPayouts[rowIdx];
      if (row.status === "Paid") return;
      row.status = "Paid";
      row.mode = "Cash/UPI";
      st.paidThisMonth = Number(st.paidThisMonth || 0) + Number(row.totalSundayPayout || 0);
      showToast(`Marked ${row.weekLabel} payout (${formatINR(row.totalSundayPayout)}) as PAID for ${st.name}!`, "emerald");
      saveState();
      render();
    }

    function downloadErpBackup(data = db, suffix = "") {
      if (session.user?.role !== "owner") {
        showToast("Only Owner can create or restore a full ERP backup.", "rose");
        return;
      }
      if (!data || typeof data !== "object") {
        showToast("ERP data is not available for backup.", "rose");
        return;
      }

      try {
        const backup = {
          app: "Sri Sai Sandhya Vastralayam & Boutique ERP",
          backupVersion: ERP_BACKUP_VERSION,
          exportedAt: new Date().toISOString(),
          data
        };
        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        const stamp = new Date().toISOString().replace(/[:.]/g, "-");
        link.href = url;
        link.download = `sri-sai-sandhya-erp-backup${suffix}-${stamp}.json`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        if (!suffix) showToast("Full ERP backup downloaded. Store the JSON file safely.", "emerald");
      } catch (error) {
        showToast("Could not create the backup file. Check available browser storage/memory.", "rose");
      }
    }

    function validateErpBackupData(restoredDb) {
      const requiredArrays = ["customers", "orders", "suppliers", "materialPurchases", "staffPayroll", "expenses"];
      return Boolean(restoredDb &&
        typeof restoredDb === "object" &&
        restoredDb.settings && typeof restoredDb.settings === "object" &&
        restoredDb.settings.credentials && typeof restoredDb.settings.credentials === "object" &&
        ["owner", "madam", "stitching", "maggam"].every(role => restoredDb.settings.credentials[role]) &&
        requiredArrays.every(key => Array.isArray(restoredDb[key])));
    }

    function applyRestoredErpData(restoredDb, sourceLabel) {
      if (!validateErpBackupData(restoredDb)) {
        showToast("Backup structure is incomplete or unsupported. Current data was not changed.", "rose");
        return false;
      }
      try {
        const currentSnapshot = JSON.stringify({
          app: "Sri Sai Sandhya Vastralayam & Boutique ERP",
          backupVersion: ERP_BACKUP_VERSION,
          exportedAt: new Date().toISOString(),
          data: db
        });
        const normalizedDb = { ...restoredDb };
        if (!Array.isArray(normalizedDb.dailyAttendanceLogs)) normalizedDb.dailyAttendanceLogs = [];
        if (!Array.isArray(normalizedDb.reviews)) normalizedDb.reviews = [];
        if (!Number.isFinite(Number(normalizedDb.smsGatewayTriggers))) normalizedDb.smsGatewayTriggers = 0;

        // Persist both copies before switching the in-memory database.
        window.localStorage.setItem(ERP_PRE_RESTORE_BACKUP_KEY, currentSnapshot);
        window.localStorage.setItem(ERP_STORAGE_KEY, JSON.stringify(normalizedDb));
        db = normalizedDb;
        session.user = { ...db.settings.credentials.owner };
        session.mode = "staff";
        session.activeTab = "dashboard";
        session.tabHistory = [];
        showToast(`${sourceLabel} restored. Previous data is saved in this browser as a recovery copy.`, "emerald");
        render();
        return true;
      } catch (error) {
        showToast("Restore failed while saving data. Current ERP records were not replaced.", "rose");
        return false;
      }
    }

    function restorePreviousErpSnapshot() {
      if (session.user?.role !== "owner") {
        showToast("Only Owner can recover ERP data.", "rose");
        return;
      }
      const saved = window.localStorage.getItem(ERP_PRE_RESTORE_BACKUP_KEY);
      const parsed = safeJsonParse(saved);
      const previousDb = parsed && parsed.data ? parsed.data : null;
      if (!validateErpBackupData(previousDb)) {
        showToast("No valid previous-data recovery copy is available in this browser.", "amber");
        return;
      }
      if (!window.confirm("Recover the ERP data saved immediately before the last restore? Current records will be replaced.")) return;
      applyRestoredErpData(previousDb, "Previous ERP data");
    }

    function restoreErpBackup(event) {
      const file = event.target.files && event.target.files[0];
      event.target.value = "";
      if (!file) return;
      if (session.user?.role !== "owner") {
        showToast("Only Owner can restore ERP data.", "rose");
        return;
      }

      const reader = new FileReader();
      reader.onerror = () => showToast("Could not read the selected backup file.", "rose");
      reader.onload = () => {
        let parsed;
        try {
          parsed = JSON.parse(String(reader.result || ""));
        } catch (error) {
          showToast("This is not a valid JSON backup file. Current data was not changed.", "rose");
          return;
        }

        const restoredDb = parsed && parsed.data ? parsed.data : parsed;
        if (!validateErpBackupData(restoredDb)) {
          showToast("Backup structure is incomplete or unsupported. Current data was not changed.", "rose");
          return;
        }

        const confirmed = window.confirm(
          `Restore ${file.name}? This replaces the current ERP records. A recovery copy will be saved first.`
        );
        if (!confirmed) return;
        applyRestoredErpData(restoredDb, "ERP backup");
      };
      reader.readAsText(file);
    }

    const DAILY_EXCEL_SYNC_HOUR = 23;
    const DAILY_EXCEL_SYNC_MINUTE = 0;
    const DAILY_EXCEL_SYNC_KEY = "SRI_SAI_SANDHYA_LAST_AUTO_EXCEL_DOWNLOAD";

    function scheduleDailyExcelDownload() {
      const now = new Date();
      const nextSync = new Date(now);
      nextSync.setHours(DAILY_EXCEL_SYNC_HOUR, DAILY_EXCEL_SYNC_MINUTE, 0, 0);
      if (nextSync <= now) nextSync.setDate(nextSync.getDate() + 1);

      setTimeout(() => {
        const today = new Date().toLocaleDateString("en-CA");
        let alreadyDownloadedToday = false;
        try {
          alreadyDownloadedToday = window.localStorage.getItem(DAILY_EXCEL_SYNC_KEY) === today;
        } catch (error) {}

        if (!alreadyDownloadedToday && session.user?.role === "owner") {
          exportErpExcelWorkbook();
          try {
            window.localStorage.setItem(DAILY_EXCEL_SYNC_KEY, today);
          } catch (error) {}
        }
        scheduleDailyExcelDownload();
      }, nextSync.getTime() - now.getTime());
    }

    function exportErpExcelWorkbook() {
      const isOwner = session.user?.role === "owner";
      const xmlEscape = value => Array.from(String(value ?? ""))
        .filter(char => {
          const code = char.charCodeAt(0);
          return code === 9 || code === 10 || code === 13 || code >= 32;
        })
        .join("")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&apos;");
      const makeSheet = (name, headers, rows) => {
        const renderRow = cells => `<Row>${cells.map(value => {
          const isNumber = typeof value === "number" && Number.isFinite(value);
          return `<Cell><Data ss:Type="${isNumber ? "Number" : "String"}">${xmlEscape(value)}</Data></Cell>`;
        }).join("")}</Row>`;
        return `<Worksheet ss:Name="${xmlEscape(name)}"><Table>${renderRow(headers)}${rows.map(renderRow).join("")}</Table></Worksheet>`;
      };

      const measurementFields = [...new Map([
        ...BLOUSE_14_FIELDS.map(field => [field.key, field.en]),
        ...Object.values(GARMENT_MEASUREMENT_SCHEMAS).flatMap(schema =>
          schema.fields.map(field => [field.key, field.label])
        )
      ]).entries()];
      const sheets = [
        makeSheet("Orders", ["Order ID", "Customer", "Mobile", "Service", "Outfit", "Status", "Booking Date", "Delivery Date", "Urgent", "Description", ...(isOwner ? ["Total Amount", "Advance Paid", "Balance"] : [])],
          db.orders.map(order => {
            const paid = (order.payments || []).reduce((sum, payment) => sum + Number(payment.amount || 0), 0);
            return [order.id, order.customerName, order.customerMobile, order.serviceType, order.outfitLabel || "", order.status,
              order.bookingDate, order.deliveryDate, order.isUrgentAllocated ? "Yes" : "No", order.garmentDesc || "",
              ...(isOwner ? [Number(order.totalAmount || 0), Number(order.advancePaid || 0), Math.max(0, Number(order.totalAmount || 0) - paid)] : [])];
          })
        ),
        makeSheet("Customers", ["Customer ID", "Name", "Mobile", "Address", "Times Serviced", "Loyalty Points"],
          db.customers.map(customer => [customer.id, customer.name, customer.mobile, customer.address,
            getCustomerServiceCount(customer.id, customer.mobile), Number(customer.loyaltyPoints || 0)])
        ),
        makeSheet("Measurements", ["Customer ID", "Customer", ...measurementFields.map(([, label]) => label)],
          db.customers.map(customer => [customer.id, customer.name,
            ...measurementFields.map(([key]) => customer.measurements?.[key] || "")])
        ),
        makeSheet("Attendance", ["Date", "Staff ID", "Staff Name", "Role", "Login Time", "Duty Start", "Duty End", "Hours", "Status"],
          (db.dailyAttendanceLogs || []).map(log => [log.date, log.staffId, log.staffName, log.role,
            log.loginTime, log.dutyStartTime, log.dutyEndTime, log.totalHours, log.status])
        ),
        makeSheet("Order Details", ["Order ID", "Customer ID", "Customer Name", "Mobile", "Address", "Branch", "Category", "Outfit Key", "Measurement Schemas", "Custom Measurements", "Design Images", "Voice Note Duration", "Voice Note Transcript", "Voice Audio Data", "Invoice Items", "Payments", "History Log"],
          db.orders.map(order => [order.id, order.customerId, order.customerName, order.customerMobile, order.customerAddress,
            order.branch, order.bookingCategory, order.outfitKey, JSON.stringify(order.measurementSchemas || []),
            JSON.stringify(order.customMeasurements || {}), JSON.stringify(order.designImages || []), order.voiceNoteDuration,
            order.voiceNoteTranscript, order.voiceAudioDataUrl || "", JSON.stringify(order.invoiceItems || []),
            JSON.stringify(order.payments || []), JSON.stringify(order.historyLog || [])])
        ),
        makeSheet("Measurement History", ["Customer ID", "Customer Name", "Date", "Note", "Measurements"],
          db.customers.flatMap(customer => (customer.measurementHistory || []).map(entry => [customer.id, customer.name,
            entry.date, entry.note, JSON.stringify(entry.values || {})]))
        ),
        makeSheet("Reviews", ["Review ID", "Customer", "Order ID", "Rating", "Comment", "Referral / Reward"],
          (db.reviews || []).map(review => [review.id, review.customerName, review.orderId, Number(review.rating || 0),
            review.comment, review.influencerTag])
        )
      ];

      if (isOwner) {
        sheets.push(
          makeSheet("Payments", ["Order ID", "Payment ID", "Date", "Type", "Mode", "Amount", "Note"],
            db.orders.flatMap(order => (order.payments || []).map(payment => [order.id, payment.id, payment.date,
              payment.type, payment.mode, Number(payment.amount || 0), payment.note || ""]))
          ),
          makeSheet("Invoice Items", ["Order ID", "Item", "Amount"],
            db.orders.flatMap(order => (order.invoiceItems || []).map(item => [order.id, item.title, Number(item.amount || 0)]))
          ),
          makeSheet("Expenses", ["Expense ID", "Date", "Category", "Mode", "Amount", "Created By", "Role"],
            db.expenses.map(expense => [expense.id, expense.date, expense.category, expense.mode,
              Number(expense.amount || 0), expense.createdByName, expense.createdByRole])
          ),
          makeSheet("Purchases", ["Purchase ID", "Date", "Supplier ID", "Items", "Amount", "Mode"],
            db.materialPurchases.map(purchase => [purchase.id, purchase.date, purchase.supplierId,
              purchase.items, Number(purchase.amount || 0), purchase.mode])
          ),
          makeSheet("Suppliers", ["Supplier ID", "Name", "Phone", "Items", "Total Purchased", "Total Paid", "Balance"],
            db.suppliers.map(supplier => [supplier.id, supplier.name, supplier.phone, supplier.itemCategory,
              Number(supplier.totalPurchased || 0), Number(supplier.totalPaid || 0),
              Number(supplier.totalPurchased || 0) - Number(supplier.totalPaid || 0)])
          ),
          makeSheet("Staff Payroll", ["Staff ID", "Name", "Role", "Payout Cycle", "Present Days", "Base Salary", "Daily Wage", "OT Hours", "OT Rate", "Paid This Month"],
            db.staffPayroll.map(staff => [staff.id, staff.name, staff.role, staff.payoutCycle, Number(staff.presentDays || 0),
              Number(staff.baseSalary || 0), Number(staff.dailyWage8Hr || 0), Number(staff.otHoursWeek || 0),
              Number(staff.otHourlyRate || 0), Number(staff.paidThisMonth || 0)])
          ),
          makeSheet("Sunday Payouts", ["Staff ID", "Staff Name", "Week", "Sunday Date", "Days Worked", "Daily Rate", "Regular Pay", "OT Hours", "OT Rate", "OT Pay", "Total Payout", "Status", "Mode"],
            db.staffPayroll.flatMap(staff => (staff.weeklySundayPayouts || []).map(payout => [staff.id, staff.name,
              payout.weekLabel, payout.sundayDate, Number(payout.daysWorked8Hr || 0), Number(payout.dailyRate8Hr || 0),
              Number(payout.regularPay8Hr || 0), Number(payout.otHours || 0), Number(payout.otRatePerHour || 0),
              Number(payout.otPay || 0), Number(payout.totalSundayPayout || 0), payout.status, payout.mode]))
          )
        );
      }

      const workbook = `<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet" xmlns:html="http://www.w3.org/TR/REC-html40">${sheets.join("")}</Workbook>`;
      try {
        const blob = new Blob([workbook], { type: "application/vnd.ms-excel;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `sri-sai-sandhya-erp-${new Date().toISOString().slice(0, 10)}.xls`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast("Latest ERP data downloaded as an Excel workbook.", "emerald");
      } catch (error) {
        showToast("Could not create the Excel workbook. Please try again.", "rose");
      }
    }

    function exportOrdersCsv() {
      const isOwner = session.user.role === "owner";
      const headers = isOwner
        ? ["OrderID", "CustomerName", "Mobile", "ServiceType", "Status", "DeliveryDate", "TotalAmount"]
        : ["OrderID", "CustomerName", "Mobile", "ServiceType", "Status", "DeliveryDate"];
      const rows = db.orders.map(o =>
        isOwner
          ? [o.id, o.customerName, o.customerMobile, o.serviceType, o.status, o.deliveryDate, o.totalAmount]
          : [o.id, o.customerName, o.customerMobile, o.serviceType, o.status, o.deliveryDate]
      );
      const csv = [headers.join(","), ...rows.map(r => r.map(x => `"${x}"`).join(","))].join("\n");
      const blob = new Blob([csv], { type: "text/csv" });
      const url = URL.createObjectURL(blob);

    function formatSecsToMMSS(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return `${m}:${s} sec`;
    }

    async function startBookingVoiceRecording() {
      syncBookingModalDomInputs();
      if (bookingModalState.isRecordingVoice) return;

      if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
        showToast("Voice recording is not supported here. Allow microphone access or upload an audio file.", "rose");
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        if (!document.getElementById("dynamic-booking-form")) {
          stream.getTracks().forEach(track => track.stop());
          return;
        }

        const mimeType = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"]
          .find(type => MediaRecorder.isTypeSupported?.(type));
        activeVoiceAudioChunks = [];
        activeVoiceSeconds = 0;
        activeVoiceMediaRecorder = mimeType
          ? new MediaRecorder(stream, { mimeType })
          : new MediaRecorder(stream);

        const recorder = activeVoiceMediaRecorder;
        recorder.ondataavailable = event => {
          if (event.data && event.data.size > 0) activeVoiceAudioChunks.push(event.data);
        };
        recorder.onerror = () => {
          stream.getTracks().forEach(track => track.stop());
          activeVoiceMediaRecorder = null;
          bookingModalState.isRecordingVoice = false;
          if (activeVoiceRecordingTimer) clearInterval(activeVoiceRecordingTimer);
          activeVoiceRecordingTimer = null;
          showToast("Recording failed. Please check microphone access and try again.", "rose");
          if (document.getElementById("dynamic-booking-form")) renderNewOrderModalContent();
        };
        recorder.onstop = () => {
          stream.getTracks().forEach(track => track.stop());
          if (activeVoiceRecordingTimer) clearInterval(activeVoiceRecordingTimer);
          activeVoiceRecordingTimer = null;
          activeVoiceMediaRecorder = null;
          bookingModalState.isRecordingVoice = false;

          const blob = new Blob(activeVoiceAudioChunks, { type: recorder.mimeType || "audio/webm" });
          activeVoiceAudioChunks = [];
          if (!blob.size) {
            showToast("No audio was captured. Check microphone permission and try again.", "rose");
            if (document.getElementById("dynamic-booking-form")) renderNewOrderModalContent();
            return;
          }

          const reader = new FileReader();
          reader.onload = event => {
            bookingModalState.voiceAudioDataUrl = event.target.result;
            bookingModalState.voiceNoteDuration = formatSecsToMMSS(Math.max(1, activeVoiceSeconds));
            showToast(`🎙️ Voice note saved (${bookingModalState.voiceNoteDuration}).`, "emerald");
            if (document.getElementById("dynamic-booking-form")) renderNewOrderModalContent();
          };
          reader.onerror = () => showToast("Could not save the recorded audio. Please try again.", "rose");
          reader.readAsDataURL(blob);
        };

        recorder.start();
        bookingModalState.isRecordingVoice = true;
        renderNewOrderModalContent();
        activeVoiceRecordingTimer = setInterval(() => {
          activeVoiceSeconds++;
          const timerEl = document.getElementById("booking-voice-timer-badge");
          if (timerEl) timerEl.textContent = `🔴 Recording... ${formatSecsToMMSS(activeVoiceSeconds)}`;
        }, 1000);
      } catch (error) {
        bookingModalState.isRecordingVoice = false;
        activeVoiceMediaRecorder = null;
        showToast("Could not access the microphone. Allow microphone permission or upload an audio file.", "rose");
      }
    }

    function stopBookingVoiceRecording() {
      syncBookingModalDomInputs();

        bookingModalState.isRecordingVoice = false;
        showToast("No active microphone recording. Allow microphone access and try again.", "rose");
        renderNewOrderModalContent();
        return;

    function generateFallbackBeepWavDataUrl() {
      // Generates a short valid 1-second 440Hz WAV audio data URL when mic hardware is restricted
      const sampleRate = 8000;
      const numSamples = 8000;
      const buffer = new ArrayBuffer(44 + numSamples * 2);
      const view = new DataView(buffer);
      const writeStr = (offset, str) => {
        for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
      };
      writeStr(0, "RIFF");
      view.setUint32(4, 36 + numSamples * 2, true);
      writeStr(8, "WAVE");
      writeStr(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, "data");
      view.setUint32(40, numSamples * 2, true);
      for (let i = 0; i < numSamples; i++) {
        const t = i / sampleRate;
        const freq = i < 4000 ? 523.25 : 659.25;
        const sample = Math.sin(2 * Math.PI * freq * t) * Math.exp(-2.5 * (t % 0.5)) * 0.35;
        view.setInt16(44 + i * 2, sample * 32767, true);
      }
      const bytes = new Uint8Array(buffer);
      let binary = "";
      for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
      return "data:audio/wav;base64," + btoa(binary);
    }

                  🗑️ Delete Order

          <!-- Interactive Design Images (Unlimited) & Voice Note inside Order Detail Modal -->

                <span class="text-xs font-extrabold uppercase text-slate-600">🖼️ Design Images (${o.designImages.length} Uploaded • Unlimited Capacity)</span>

              ${o.designImages.map((img, idx) => `
                <button type="button" onclick="openDesignImageViewerModal('${o.id}', ${idx})"
                  class="rounded-xl overflow-hidden border-2 border-stone-300 hover:border-maroon-700 shrink-0 cursor-pointer">
                  <img src="${img}" alt="Design ${idx + 1}" class="w-28 h-20 object-cover" />

              `).join("")}
            </div>
            <div class="text-xs text-amber-950 bg-amber-50 border border-amber-200 p-2.5 rounded-xl">
              🎙️ <strong>Voice Note Transcript:</strong> "${o.voiceNoteTranscript}"
            </div>
          </div>

          <div class="space-y-2">
            <h4 class="text-xs font-extrabold uppercase text-slate-500">Order Audit & Auto-Transfer Trail</h4>
            <div class="space-y-1.5">
              ${raw.historyLog.map(h => `
                <div class="p-2.5 rounded-xl bg-stone-50 border border-stone-200 text-xs flex justify-between">
                  <span class="font-semibold text-slate-800">${h.text}</span>
                  <span class="font-mono text-[11px] text-slate-500">${h.time}</span>
                </div>
              `).join("")}

          </div>
