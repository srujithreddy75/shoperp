    function appendUnlimitedImagesToExistingOrder(event, orderId) {
      const files = Array.from(event.target.files || []);
      const ord = db.orders.find(o => o.id === orderId);
      if (!ord || files.length === 0) return;
      let loadedCount = 0;
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(evt) {
          ord.designImages.push(evt.target.result);
          loadedCount++;
          if (loadedCount === files.length) {
            showToast(`Added ${files.length} design image(s) to ${ord.id} (Total: ${ord.designImages.length})!`, "emerald");
            openOrderDetailModal(orderId);
            render();
          }
        };
        reader.readAsDataURL(file);
      });
    }

    function openNewOrderModal(preselectCustId) {
      stopActiveVoiceRecordingSession();
      const custId = preselectCustId || db.customers[0]?.id || "CUST-1001";
      const initCust = db.customers.find(c => c.id === custId) || db.customers[0];
      tempOrderDesignImages = [];
      bookingModalState = {
        customerId: initCust ? initCust.id : "CUST-1001",
        customerMobileSearch: initCust ? initCust.mobile : "",
        customerMatchStatus: initCust ? "matched" : "not_found",
        newCustomerName: "",
        newCustomerAddress: "",
        mainCategory: "STITCHING",
        outfitKey: "BLOUSE_ONLY",
        garmentDesc: "",
        deliveryDate: "2026-11-20",
        isUrgentAllocated: true,
        urgentNote: "Urgent Next 10 Days Priority",
        totalAmount: 0,
        advancePaid: 0,
        advancePaymentMode: "UPI",
        voiceNoteTranscript: "",
        voiceAudioDataUrl: "",
        voiceNoteDuration: "No Audio",
        isRecordingVoice: false,
        measurements: {}
      };
      // Start booking measurements blank so the selected outfit's sizes must be entered.
      Object.keys(GARMENT_MEASUREMENT_SCHEMAS).forEach(sKey => {
        GARMENT_MEASUREMENT_SCHEMAS[sKey].fields.forEach(f => {
          bookingModalState.measurements[f.key] = "";
        });
      });
      renderNewOrderModalContent();
    }

    function applyCustomerToBookingModal(cust) {
      if (!cust) return;
      bookingModalState.customerId = cust.id;
      bookingModalState.customerMobileSearch = cust.mobile;
      bookingModalState.customerMatchStatus = "matched";
      // Keep new booking measurement fields blank so staff enter fresh sizes.
      Object.keys(GARMENT_MEASUREMENT_SCHEMAS).forEach(sKey => {
        GARMENT_MEASUREMENT_SCHEMAS[sKey].fields.forEach(f => {
          bookingModalState.measurements[f.key] = "";
        });
      });
    }

    function fetchBookingCustomerByMobile(rawMobile) {
      syncBookingModalDomInputs();
      const inputEl = document.getElementById("booking-mobile-search-input");
      const query = String(rawMobile !== undefined ? rawMobile : (inputEl ? inputEl.value : "")).trim();
      bookingModalState.customerMobileSearch = query;

      const cleanDigits = query.replace(/\D/g, "");
      const exactMatch = db.customers.find(
        c => c.mobile === cleanDigits || c.mobile === query
      );
      const partialMatch = !exactMatch && cleanDigits.length >= 4
        ? db.customers.find(c => c.mobile.includes(cleanDigits) || c.name.toLowerCase().includes(query.toLowerCase()))
        : null;

      const found = exactMatch || partialMatch;
      if (found) {
        applyCustomerToBookingModal(found);
        showToast(`✅ Fetched Customer: ${found.name} (${found.mobile}) & loaded saved measurements!`, "emerald");
      } else {
        bookingModalState.customerMatchStatus = "not_found";
        if (cleanDigits.length >= 10) {
          showToast(`No repeat customer found for ${cleanDigits}. Fill Name & Address below to auto-register with this booking!`, "amber");
        }
      }
      renderNewOrderModalContent();
    }

    function handleBookingCustomerDropdownChange(custId) {
      syncBookingModalDomInputs();
      const found = db.customers.find(c => c.id === custId);
      if (found) {
        applyCustomerToBookingModal(found);
        showToast(`✅ Loaded ${found.name} (${found.mobile}) data & measurements!`, "emerald");
        renderNewOrderModalContent();
      }
    }

    function syncBookingModalDomInputs() {
      const form = document.getElementById("dynamic-booking-form");
      if (!form) return;
      const fd = new FormData(form);
      if (fd.get("customerId")) bookingModalState.customerId = fd.get("customerId");
      if (fd.get("customerMobileSearch") !== null) bookingModalState.customerMobileSearch = fd.get("customerMobileSearch");
      if (fd.get("newCustomerName") !== null) bookingModalState.newCustomerName = fd.get("newCustomerName");
      if (fd.get("newCustomerAddress") !== null) bookingModalState.newCustomerAddress = fd.get("newCustomerAddress");
      if (fd.get("deliveryDate")) bookingModalState.deliveryDate = fd.get("deliveryDate");
      if (fd.get("totalAmount") !== null) bookingModalState.totalAmount = Number(fd.get("totalAmount"));
      if (fd.get("advancePaid") !== null) bookingModalState.advancePaid = Number(fd.get("advancePaid"));
      if (fd.get("advancePaymentMode")) bookingModalState.advancePaymentMode = fd.get("advancePaymentMode");
      if (fd.get("voiceNoteTranscript") !== null) bookingModalState.voiceNoteTranscript = fd.get("voiceNoteTranscript");
      const urgCheckbox = document.getElementById("booking-urgent-checkbox");
      if (urgCheckbox) bookingModalState.isUrgentAllocated = urgCheckbox.checked;

      const activeSchemas = getSchemasForOutfitKey(bookingModalState.outfitKey);
      activeSchemas.forEach(sKey => {
        const schema = GARMENT_MEASUREMENT_SCHEMAS[sKey];
        if (!schema) return;
        schema.fields.forEach(f => {
          const val = fd.get(f.key);
          if (val !== null) bookingModalState.measurements[f.key] = val;
        });
      });
    }

    function selectBookingMainCategory(catKey) {
      syncBookingModalDomInputs();
      bookingModalState.mainCategory = catKey;
      const firstOutfit = BOOKING_CATEGORY_OPTIONS[catKey].outfits[0];
      bookingModalState.outfitKey = firstOutfit.key;
      renderNewOrderModalContent();
    }

    function selectBookingOutfitOption(outfitKey) {
      syncBookingModalDomInputs();
      bookingModalState.outfitKey = outfitKey;
      renderNewOrderModalContent();
    }

    function handleUnlimitedBookingImagesUpload(event) {
      syncBookingModalDomInputs();
      const files = Array.from(event.target.files || []);
      if (files.length === 0) return;
      let loaded = 0;
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(evt) {
          tempOrderDesignImages.push(evt.target.result);
          loaded++;
          if (loaded === files.length) {
            showToast(`Uploaded ${files.length} image(s)! Total attached: ${tempOrderDesignImages.length} (Unlimited)`, "emerald");
            renderNewOrderModalContent();
          }
        };
        reader.readAsDataURL(file);
      });
    }

    function addInstantSampleDesignImage() {
      syncBookingModalDomInputs();
      const nextNum = tempOrderDesignImages.length + 1;
      tempOrderDesignImages.push(`https://placehold.co/300x220/681120/fef08a?text=Design+Sketch+%23${nextNum}`);
      renderNewOrderModalContent();
    }

    function removeTempOrderDesignImage(idx) {
      syncBookingModalDomInputs();
      tempOrderDesignImages.splice(idx, 1);
      renderNewOrderModalContent();
    }

    function renderNewOrderModalContent() {

            <div>
              <span class="text-[10px] font-extrabold uppercase tracking-wider text-maroon-700 bg-maroon-50 px-2.5 py-1 rounded-full">

            <button type="button" onclick="closeModal()" class="px-3 py-1 rounded-xl bg-stone-100 text-xs font-bold cursor-pointer">✕</button>

              <div class="flex flex-wrap items-center justify-between gap-2">
                <label class="block font-extrabold text-maroon-900 uppercase tracking-wider text-[11px]">
                  📱 Fetch Repeat Customer Data by Mobile Number
                </label>
                <div class="flex flex-wrap gap-1.5">
                  ${db.customers.slice(0, 3).map(c => `
                    <button type="button" onclick="fetchBookingCustomerByMobile('${c.mobile}')"
                      class="px-2.5 py-1 rounded-lg bg-white hover:bg-maroon-900 hover:text-gold-400 border border-stone-300 font-mono text-[10px] font-extrabold transition cursor-pointer">
                      ⚡ ${c.mobile} (${c.name.split(" ")[0]})
                    </button>
                  `).join("")}
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-12 gap-2.5 items-end">

                    />
                    <button type="button" onclick="fetchBookingCustomerByMobile()"
                      class="px-4 py-2.5 rounded-xl bg-maroon-800 hover:bg-maroon-900 text-gold-400 font-extrabold text-xs shadow-sm cursor-pointer shrink-0">

                  </select>
                </div>
              </div>

              <!-- Fetched Customer Details Card OR Instant New Customer Auto-Registration -->
              ${isCustMatched ? `
                <div class="p-3.5 rounded-2xl bg-emerald-50 border border-emerald-300 flex flex-wrap items-center justify-between gap-3">
                  <div class="flex items-center gap-3">
                    ${canViewCustomerProfilePhoto() ? `
                      <img src="${matchedCust.photoUrl || 'https://placehold.co/80x80/801326/ffffff?text=C'}"

                    ` : `
                      <div class="w-11 h-11 rounded-xl bg-emerald-700 text-white font-extrabold flex items-center justify-center text-sm">✓</div>
                    `}
                    <div>

                      </div>
                      <p class="text-[11px] text-emerald-800 mt-0.5">

                    <button type="button" onclick="openNewCustomerModal()"

                      <label class="block text-[10px] font-bold text-amber-950 mb-0.5">New Customer Full Name *</label>

                  <span class="text-xs font-extrabold px-2 py-0.5 rounded-full ${
                    bookingModalState.mainCategory === "MAGGAM" ? "bg-gold-500 text-maroon-900" : "bg-stone-100 text-slate-600"
                  }">${bookingModalState.mainCategory === "MAGGAM" ? "✓ Selected" : "Select"}</span>

                <button type="button" onclick="selectBookingMainCategory('STITCHING')"
                  class="p-3.5 rounded-2xl border-2 text-left transition cursor-pointer flex items-center justify-between ${
                    bookingModalState.mainCategory === "STITCHING"

                  <div>
                    <div class="font-extrabold text-sm">🪡 2. Stitching Category</div>
                    <div class="text-[11px] ${bookingModalState.mainCategory === "STITCHING" ? "text-amber-200" : "text-slate-500"}">

                  <span class="text-xs font-extrabold px-2 py-0.5 rounded-full ${
                    bookingModalState.mainCategory === "STITCHING" ? "bg-gold-500 text-maroon-900" : "bg-stone-100 text-slate-600"

    function submitNewOrder(e) {
      e.preventDefault();
      syncBookingModalDomInputs();

      const activeSchemas = getSchemasForOutfitKey(bookingModalState.outfitKey);

      let cust = db.customers.find(c => c.id === bookingModalState.customerId);

      // If mobile number search was for a brand-new customer, auto-register them on booking submit
      if (bookingModalState.customerMatchStatus === "not_found" && bookingModalState.newCustomerName.trim()) {
        const cleanMob = (bookingModalState.customerMobileSearch || "").replace(/\D/g, "") || "9000000000";
        const newCustId = `CUST-${1001 + db.customers.length}`;
        const nameStr = bookingModalState.newCustomerName.trim();
        cust = {
          id: newCustId,
          name: nameStr,
          mobile: cleanMob,
          address: (bookingModalState.newCustomerAddress || SINGLE_BRANCH_NAME).trim(),
          photoUrl: `https://placehold.co/160x160/801326/ffffff?text=${encodeURIComponent(nameStr.slice(0, 8))}`,
          loyaltyPoints: 100,
          referralCode: nameStr.slice(0, 5).toUpperCase() + "100",
          referredBy: "Direct Booking Counter",
          measurements: createDefaultMeasurements(bookingModalState.measurements),
          measurementHistory: [
            {
              date: new Date().toISOString().slice(0, 10),
              note: "Initial Booking Measurement",
              values: createDefaultMeasurements(bookingModalState.measurements)
            }
          ]
        };
        db.customers.push(cust);
        session.selectedCustomerId = cust.id;
      }

      if (!cust) cust = db.customers[0];
      const isMaggam = bookingModalState.mainCategory === "MAGGAM";
      const serviceType = isMaggam ? "Maggam Work + Blouse Stitching" : "Blouse Stitching Only";
      const outfitLabel = getOutfitLabel(bookingModalState.outfitKey);
      const totalAmount = Number(bookingModalState.totalAmount || 0);
      const advancePaid = Math.min(totalAmount, Math.max(0, Number(bookingModalState.advancePaid || 0)));
      const advanceMode = bookingModalState.advancePaymentMode || "UPI";
      const todayIso = new Date().toISOString().slice(0, 10);
      const newId = `ORD-${2001 + db.orders.length}`;

      const capturedCustomMeasurements = {};
      activeSchemas.forEach(sKey => {
        const schema = GARMENT_MEASUREMENT_SCHEMAS[sKey];
        if (!schema) return;
        schema.fields.forEach(f => {
          capturedCustomMeasurements[f.key] =
            bookingModalState.measurements[f.key] !== undefined && bookingModalState.measurements[f.key] !== ""
              ? bookingModalState.measurements[f.key]
              : "0";
        });
      });

      const initialPayments = advancePaid > 0
        ? [
            {
              id: `PAY-${900 + db.orders.length + 1}`,
              date: todayIso,
              type: advancePaid >= totalAmount && totalAmount > 0 ? "Full Payment" : "Advance",
              mode: advanceMode,
              amount: advancePaid,
              note: `Booking Time Advance Entered by ${session.user?.name || "Madam"}`
            }
          ]
        : [];

      const newOrder = {
        id: newId,
        customerId: cust.id,
        customerName: cust.name,
        customerMobile: cust.mobile,
        customerAddress: cust.address,
        branch: SINGLE_BRANCH_NAME,
        serviceType,
        bookingCategory: bookingModalState.mainCategory,
        outfitKey: bookingModalState.outfitKey,
        outfitLabel,
        measurementSchemas: activeSchemas,
        customMeasurements: capturedCustomMeasurements,
        status: isMaggam ? "Maggam Assigned" : "Stitching Assigned",
        bookingDate: todayIso,
        deliveryDate: bookingModalState.deliveryDate,
        isUrgentAllocated: Boolean(bookingModalState.isUrgentAllocated),
        urgentNote: bookingModalState.isUrgentAllocated ? "Urgent Priority Allocation" : "",
        assignedMaggam: isMaggam ? "Salim Karigar (Maggam)" : "-",
        assignedStitching: "Ramesh Master (Stitching)",
        garmentDesc: outfitLabel,
        designImages: tempOrderDesignImages.length > 0
          ? [...tempOrderDesignImages]
          : ["https://placehold.co/300x220/801326/ffffff?text=Design+Sketch"],
        voiceAudioDataUrl: bookingModalState.voiceAudioDataUrl || "",
        voiceNoteDuration: bookingModalState.voiceAudioDataUrl
          ? (bookingModalState.voiceNoteDuration || "00:15 sec")
          : (bookingModalState.voiceNoteTranscript && bookingModalState.voiceNoteTranscript.trim() ? "Written Note" : "None"),
        voiceNoteTranscript: (bookingModalState.voiceNoteTranscript && bookingModalState.voiceNoteTranscript.trim())
          ? bookingModalState.voiceNoteTranscript.trim()
          : "No written note",
        measurementsSnapshot: {
          ...cust.measurements,
          blouseLength: capturedCustomMeasurements.blouse_length || cust.measurements.blouseLength,
          shoulder: capturedCustomMeasurements.blouse_shoulder || cust.measurements.shoulder,
          chest: capturedCustomMeasurements.blouse_upperChest || cust.measurements.chest,
          bust: capturedCustomMeasurements.blouse_chest || cust.measurements.bust,
          waist: capturedCustomMeasurements.blouse_waist || cust.measurements.waist,
          frontNeck: capturedCustomMeasurements.blouse_frontNeck || cust.measurements.frontNeck,
          backNeck: capturedCustomMeasurements.blouse_neck || cust.measurements.backNeck,
          sleeveLength: capturedCustomMeasurements.blouse_handLength || cust.measurements.sleeveLength,
          sleeveRound: capturedCustomMeasurements.blouse_handLoose || cust.measurements.sleeveRound,
          armhole: capturedCustomMeasurements.blouse_underRound || cust.measurements.armhole
        },
        invoiceItems: [{ title: `${serviceType} (${outfitLabel})`, amount: totalAmount }],
        totalAmount,
        advancePaid,
        payments: initialPayments,
        historyLog: [
          {
            time: "Just now",
            text: `Booked ${serviceType} (${outfitLabel}) by ${session.user?.name || "Staff"} with ${tempOrderDesignImages.length} design image(s) at ${SINGLE_BRANCH_NAME} (No auto-SMS)`
          }
        ]
      };

      db.orders.unshift(newOrder);
      saveState();
      render();
      openBookingSuccessPopupModal(newOrder);
    }

    async function startCustomerCamera() {
      const box = document.getElementById("cust-camera-container");
      const video = document.getElementById("cust-camera-video");
      if (!box || !video) return;
      box.classList.remove("hidden");
      try {
        activeCameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
        video.srcObject = activeCameraStream;
      } catch (err) {
        showToast("Camera permission unavailable in this browser frame; generating instant camera snapshot.", "amber");
        tempCustomerPhotoData = "https://placehold.co/160x160/047857/ffffff?text=Camera+Shot";
        const preview = document.getElementById("new-cust-photo-preview");
        if (preview) preview.src = tempCustomerPhotoData;
        box.classList.add("hidden");
      }
    }

    function captureCustomerCameraFrame() {
      const video = document.getElementById("cust-camera-video");
      if (video && video.videoWidth > 0) {
        const canvas = document.createElement("canvas");
        canvas.width = 160;
        canvas.height = 160;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, 160, 160);
        tempCustomerPhotoData = canvas.toDataURL("image/jpeg", 0.85);
      } else {
        tempCustomerPhotoData = "https://placehold.co/160x160/047857/ffffff?text=Camera+Photo";
      }
      const preview = document.getElementById("new-cust-photo-preview");
      if (preview) preview.src = tempCustomerPhotoData;
      stopCameraStream();
      const box = document.getElementById("cust-camera-container");
      if (box) box.classList.add("hidden");
      showToast("Customer photo captured from camera!", "emerald");
    }

    function handleCustomerPhotoUpload(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        tempCustomerPhotoData = evt.target.result;
        const preview = document.getElementById("new-cust-photo-preview");
        if (preview) preview.src = tempCustomerPhotoData;
        showToast("Customer photo uploaded!", "emerald");
      };
      reader.readAsDataURL(file);
    }

    function submitNewCustomer(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const id = `CUST-${1001 + db.customers.length}`;
      const name = fd.get("name").trim();
      const newCust = {
        id,
        name,
        mobile: fd.get("mobile").trim(),
        address: fd.get("address").trim(),
        photoUrl: tempCustomerPhotoData || `https://placehold.co/160x160/801326/ffffff?text=${encodeURIComponent(name.slice(0, 8))}`,
        loyaltyPoints: 100,
        referralCode: name.slice(0, 5).toUpperCase() + "100",
        referredBy: "Walk-in Main Branch",
        measurements: createDefaultMeasurements(),
        measurementHistory: [
          { date: new Date().toISOString().slice(0, 10), note: "Initial Registration", values: createDefaultMeasurements() }
        ]
      };
      db.customers.push(newCust);
      session.selectedCustomerId = id;
      closeModal();
      showToast(`Customer ${name} (${id}) registered with profile photo!`, "emerald");
      render();
    }

    function openRecordPaymentModal(orderId) {
      if (session.user?.role !== "owner") return;
      const o = db.orders.find(x => x.id === orderId);
      if (!o) return;
      const paid = o.payments.reduce((s, p) => s + Number(p.amount || 0), 0);
      const bal = Math.max(0, o.totalAmount - paid);

      openModalHtml(`
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-stone-200">
          <h3 class="text-base font-extrabold text-slate-900">Record Payment for ${o.id}</h3>
          <form onsubmit="submitOrderPayment(event, '${o.id}')" class="mt-4 space-y-3 text-xs">
            <div>
              <label class="block font-bold mb-1">Amount (Balance: ₹${bal})</label>
              <input type="number" name="amount" value="${bal}" required class="w-full px-3 py-2 rounded-xl border border-stone-300 font-mono font-bold" />
            </div>
            <div>
              <label class="block font-bold mb-1">Payment Mode</label>
              <select name="mode" class="w-full px-3 py-2 rounded-xl border border-stone-300">
                <option value="UPI">UPI</option>
                <option value="Cash">Cash</option>
                <option value="Card">Card</option>
                <option value="Bank">Bank Transfer</option>
              </select>
            </div>
            <div class="flex justify-end gap-2 pt-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-stone-300 font-bold cursor-pointer">Cancel</button>
              <button type="submit" class="px-4 py-2 rounded-xl bg-emerald-700 text-white font-bold cursor-pointer">Save Payment</button>
            </div>
          </form>
        </div>
      `);
    }

    function submitOrderPayment(e, orderId) {
      e.preventDefault();
      const o = db.orders.find(x => x.id === orderId);
      if (!o) return;
      const fd = new FormData(e.target);
      const amt = Number(fd.get("amount") || 0);
      o.payments.push({
        id: `PAY-${900 + o.payments.length + 1}`,
        date: new Date().toISOString().slice(0, 10),
        type: "Balance",
        mode: fd.get("mode"),
        amount: amt,
        note: "Recorded by Owner"
      });
      closeModal();
      showToast(`Recorded ₹${amt} payment for ${o.id}`, "emerald");
      render();
    }

    function openAddExpenseModal() {
      const u = session.user || db.settings.credentials.owner;
      openModalHtml(`
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-stone-200 text-xs">
          <h3 class="text-base font-extrabold text-slate-900">Record Expense (${u.name})</h3>
          <p class="text-[11px] text-slate-500 mt-0.5">This expense will be saved under your login (${u.role.toUpperCase()}).</p>
          <form onsubmit="submitNewExpense(event)" class="mt-4 space-y-3">
            <input type="text" name="category" required placeholder="Expense Description (e.g. Needles, Threads, Tea)" class="w-full px-3 py-2 rounded-xl border border-stone-300" />
            <select name="mode" class="w-full px-3 py-2 rounded-xl border border-stone-300">
              <option value="Cash">Cash</option>
              <option value="UPI">UPI</option>
              <option value="Bank">Bank</option>
            </select>
            <input type="number" name="amount" required placeholder="Amount (₹)" class="w-full px-3 py-2 rounded-xl border border-stone-300" />
            <div class="flex justify-end gap-2 pt-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-stone-300 font-bold cursor-pointer">Cancel</button>
              <button type="submit" class="px-4 py-2 rounded-xl bg-maroon-700 text-white font-bold cursor-pointer">Save Expense</button>
            </div>
          </form>
        </div>
      `);
    }

    function submitNewExpense(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const u = session.user || db.settings.credentials.owner;
      db.expenses.unshift({
        id: `EXP-0${db.expenses.length + 1}`,
        date: new Date().toISOString().slice(0, 10),
        category: fd.get("category"),
        mode: fd.get("mode"),
        amount: Number(fd.get("amount")),
        createdByRole: u.role,
        createdByName: u.name
      });
      closeModal();
      showToast(`Expense added under ${u.name}!`, "emerald");
      render();
    }

    /*************************************************************************
     * 20. MAIN RENDER LOOP & STARTUP
     *************************************************************************/
    function render() {
      const root = document.getElementById("app");
      if (!root) return;

      if (session.mode === "staff" && session.user) {
        root.innerHTML = renderStaffShell();
      } else {
        root.innerHTML = renderGateway();
      }
    }

    window.onload = async function () {
      initDatabase();
      render();
      scheduleDailyExcelDownload();
      await fetchServerState();
      connectSSE();
    };
  </script>
</body>
</html>
